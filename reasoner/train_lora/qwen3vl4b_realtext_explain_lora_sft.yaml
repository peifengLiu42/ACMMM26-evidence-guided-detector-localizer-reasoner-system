### model
model_name_or_path: /path/to/Qwen3-VL-4B-Instruct
image_max_pixels: 1048576
video_max_pixels: 16384
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: lora
freeze_vision_tower: true
freeze_multi_modal_projector: false
lora_rank: 32
lora_target: all
# deepspeed: train/deepspeed/ds_z3_config.json

### dataset
dataset_dir: data
dataset: realtext_explain_train_sft
template: qwen3_vl
cutoff_len: 10000
max_samples: 13500 # 13500
overwrite_cache: true
preprocessing_num_workers: 16
dataloader_num_workers: 16

### output
output_dir: saves/qwen3vl-4b_realtext_explain/lora/sft
logging_steps: 5
save_steps: 2000
plot_loss: true
overwrite_output_dir: true
save_only_model: false
report_to: none

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 1.0e-4
num_train_epochs: 15.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000
resume_from_checkpoint: null

